name: Publish gem

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-gem-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to RubyGems
    outputs:
      version: ${{ steps.release.outputs.version }}
      uploaded: ${{ steps.upload.outputs.uploaded }}
      verified: ${{ steps.registry.outputs.verified }}
    if: ${{ !github.event.release.prerelease }}
    # ruby/setup-ruby cannot install Ruby 2.7.6 on Ubuntu 26.04 (see ruby async PR #59).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write # Required for RubyGems OpenID Connect trusted publishing.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out the release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0
        with:
          ruby-version: '2.7'

      - name: Validate the release version
        id: release
        run: |
          version="$(./scripts/publish_gem.sh validate)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the gem
        env:
          GEM_FILE: rudder_analytics_sync-${{ steps.release.outputs.version }}.gem
        run: gem build rudder_analytics_sync.gemspec --output "$GEM_FILE"

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the gem
        id: upload
        env:
          GEM_FILE: rudder_analytics_sync-${{ steps.release.outputs.version }}.gem
        run: |
          gem push "$GEM_FILE"
          echo 'uploaded=true' >> "$GITHUB_OUTPUT"

      - name: Verify the published version
        id: registry
        run: |
          ./scripts/publish_gem.sh verify
          echo 'verified=true' >> "$GITHUB_OUTPUT"

  published-e2e:
    name: Accept exact published package
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/published-sdk-e2e.yml
    with:
      package-version: ${{ needs.publish.outputs.version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-release:
    name: Report final release outcome
    needs: [publish, published-e2e]
    if: ${{ always() && github.event_name == 'release' && !github.event.release.prerelease && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
      UPLOADED: ${{ needs.publish.outputs.uploaded }}
      VERIFIED: ${{ needs.publish.outputs.verified }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      E2E_RESULT: ${{ needs['published-e2e'].result }}
      CENTRAL_RUN_URL: ${{ needs['published-e2e'].outputs.run-url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Build the root notification payload
        id: root_payload
        run: |
          if [[ "$PUBLISH_RESULT" == success && "$VERIFIED" == true && "$E2E_RESULT" == success ]]; then
            outcome='accepted'
          elif [[ "$VERIFIED" == true ]]; then
            outcome='published; validation failed or incomplete'
          elif [[ "$UPLOADED" == true ]]; then
            outcome='upload completed; registry validation failed or incomplete'
          elif [[ "$PUBLISH_RESULT" == cancelled ]]; then
            outcome='publication cancelled; package status unconfirmed'
          elif [[ "$PUBLISH_RESULT" == skipped ]]; then
            outcome='publication skipped; package status unconfirmed'
          else
            outcome='publication failed or unconfirmed'
          fi

          payload="$(jq -cn \
            --arg tag "$RELEASE_TAG" \
            --arg date "$(date -u +%Y-%m-%d)" \
            --arg outcome "$outcome" \
            '{text: ("Ruby (Sync) SDK " + $tag + " (" + $date + "): " + $outcome + "\nCC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>"), unfurl_links: false, unfurl_media: false}')"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
          printf 'Ruby Sync SDK %s: %s\nPublication: %s; registry verified: %s; E2E: %s.\nCentral E2E: %s\n' "$RELEASE_TAG" "$outcome" "$PUBLISH_RESULT" "$VERIFIED" "$E2E_RESULT" "$CENTRAL_RUN_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Send the short release announcement
        id: root
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: ${{ steps.root_payload.outputs.payload }}

      - name: Build the thread reply payload
        id: reply_payload
        env:
          ROOT_TS: ${{ steps.root.outputs.ts }}
        run: |
          if [[ ! "$ROOT_TS" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo 'Slack root message returned no valid timestamp; refusing to post a channel-level reply.' >&2
            exit 1
          fi

          registry_link='RubyGems version unavailable'
          if [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            registry_link="<https://rubygems.org/gems/rudder_analytics_sync/versions/$RELEASE_VERSION|Exact RubyGems version>"
          fi

          upload_result='failed or unconfirmed'
          [[ "$UPLOADED" == true ]] && upload_result='completed'
          registry_result='failed or incomplete'
          [[ "$VERIFIED" == true ]] && registry_result='verified'
          e2e_result="${E2E_RESULT:-not run}"

          payload="$(jq -cn \
            --arg ts "$ROOT_TS" \
            --arg release_url "$RELEASE_URL" \
            --arg registry_link "$registry_link" \
            --arg run_url "$RUN_URL" \
            --arg publish_result "$PUBLISH_RESULT" \
            --arg upload_result "$upload_result" \
            --arg registry_result "$registry_result" \
            --arg e2e_result "$e2e_result" --arg central "$CENTRAL_RUN_URL" \
            '{thread_ts: $ts, reply_broadcast: false, text: ("<" + $release_url + "|Release> | " + $registry_link + " | <" + $run_url + "|Publication and E2E checks>\nPublication job: " + $publish_result + ". Gem upload: " + $upload_result + ". RubyGems verification: " + $registry_result + ". Full E2E delivery and cleanup: " + $e2e_result + "." + (if $central != "" then "\n<" + $central + "|Central E2E run>" else "" end)), unfurl_links: false, unfurl_media: false}')"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"

      - name: Reply with release links and check results
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: ${{ steps.reply_payload.outputs.payload }}
