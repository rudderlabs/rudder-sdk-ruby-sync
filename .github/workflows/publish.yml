name: Publish gem

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-gem-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to RubyGems
    outputs:
      version: ${{ steps.release.outputs.version }}
      uploaded: ${{ steps.upload.outputs.uploaded }}
    if: ${{ !github.event.release.prerelease }}
    # ruby/setup-ruby cannot install Ruby 2.7.6 on Ubuntu 26.04 (see ruby async PR #59).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write # Required for RubyGems OpenID Connect trusted publishing.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out the release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0
        with:
          ruby-version: '2.7'

      - name: Validate the release version
        id: release
        run: |
          version="$(./scripts/publish_gem.sh validate)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the gem
        env:
          GEM_FILE: rudder_analytics_sync-${{ steps.release.outputs.version }}.gem
        run: gem build rudder_analytics_sync.gemspec --output "$GEM_FILE"

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the gem
        id: upload
        env:
          GEM_FILE: rudder_analytics_sync-${{ steps.release.outputs.version }}.gem
        run: |
          gem push "$GEM_FILE"
          echo 'uploaded=true' >> "$GITHUB_OUTPUT"

      - name: Verify the published version
        run: ./scripts/publish_gem.sh verify

  published-e2e:
    name: Accept exact published package
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/published-sdk-e2e.yml
    with:
      package-version: ${{ needs.publish.outputs.version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-release:
    name: Report published release outcome
    needs: [publish, published-e2e]
    if: ${{ always() && !github.event.release.prerelease && needs.publish.outputs.uploaded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROJECT_NAME: Ruby (Sync) SDK
      ACCEPTANCE_RESULT: ${{ needs.publish.result == 'success' && needs['published-e2e'].result == 'success' && 'accepted' || 'published; validation failed or incomplete' }}
      REGISTRY_RESULT: ${{ needs.publish.result == 'success' && 'verified' || 'failed or incomplete' }}
      E2E_RESULT: ${{ needs['published-e2e'].result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Record the UTC release date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Send the short release announcement
        id: root
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: |
            {
              "text": "${{ env.PROJECT_NAME }} ${{ github.event.release.tag_name }} (${{ steps.date.outputs.value }}): ${{ env.ACCEPTANCE_RESULT }}\nCC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>",
              "unfurl_links": false,
              "unfurl_media": false
            }

      - name: Reply with release links and check results
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}"
          payload: |
            {
              "thread_ts": "${{ steps.root.outputs.ts }}",
              "reply_broadcast": false,
              "text": "<${{ github.event.release.html_url }}|Release> | <https://rubygems.org/gems/rudder_analytics_sync/versions/${{ needs.publish.outputs.version }}|Exact RubyGems version> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Publication and E2E checks>\nRubyGems verification: ${{ env.REGISTRY_RESULT }}. Full E2E delivery and cleanup: ${{ env.E2E_RESULT }}.",
              "unfurl_links": false,
              "unfurl_media": false
            }
